[project]
name = "rag-type-system"
version = "0.1.0"
description = "Local multimodal RAG over text, PDFs and images with Postgres + pgvector and Ollama"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pypdf>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
